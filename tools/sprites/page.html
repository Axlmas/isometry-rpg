<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// One frame of the sheet, in pixels. The game shows frames at half this size,
// so the sprites stay sharp when the camera zooms in.
const FRAME = 160;
// Each frame is rendered this many times larger and scaled down, for smooth edges.
const SUPERSAMPLE = 3;
// World units covered by a frame from top to bottom, and where the model's
// feet sit inside the frame (as shares of its width and height).
const VIEW_HEIGHT = 3.3;
const ANCHOR = { x: 0.5, y: 0.78 };
// The game's ground tiles are twice as wide as tall, which is what a camera
// 30 degrees above the horizon sees.
const ELEVATION = Math.PI / 6;
const SHEET_COLUMNS = 16;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(FRAME * SUPERSAMPLE, FRAME * SUPERSAMPLE);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.OrthographicCamera(-VIEW_HEIGHT / 2, VIEW_HEIGHT / 2, VIEW_HEIGHT / 2, -VIEW_HEIGHT / 2, 0.1, 100);
// Looking from the (+x, +z) corner: the game's tile x axis runs down-right
// on the screen and its y axis down-left, like +X and +Z do here.
const horizontal = Math.cos(ELEVATION) * 20;
camera.position.set(horizontal / Math.SQRT2, Math.sin(ELEVATION) * 20, horizontal / Math.SQRT2);
camera.lookAt(0, 0, 0);
// Shift the view so that the feet (the origin) land on the anchor point.
camera.setViewOffset(FRAME, FRAME, (0.5 - ANCHOR.x) * FRAME, (0.5 - ANCHOR.y) * FRAME, FRAME, FRAME);

/** A soft, slightly cool sky light and a warm sun from the upper left: readable but not cartoon-bright. */
function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xdfe6f2, 0x4a4036, 1.5));
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
  sun.position.set(-4, 9, 6);
  scene.add(sun);
}

window.renderCharacter = async (character, optionalParts) => {
  const gltf = await new GLTFLoader().loadAsync(`/assets/${character.model}`);
  const scene = new THREE.Scene();
  lights(scene);
  const model = gltf.scene;
  scene.add(model);
  model.traverse((node) => {
    if (optionalParts.includes(node.name)) node.visible = character.show.includes(node.name);
    // Small parts would otherwise vanish when they swing outside the model's resting bounds.
    if (node.isMesh) node.frustumCulled = false;
  });

  const directions = character.directions ?? [0, 1, 2, 3, 4, 5, 6, 7];
  const mixer = new THREE.AnimationMixer(model);
  const cells = [];
  for (const [name, spec] of Object.entries(character.animations)) {
    const clip = gltf.animations.find((candidate) => candidate.name === spec.clip);
    if (!clip) throw new Error(`${character.name}: the model has no animation "${spec.clip}"`);
    for (const direction of directions) {
      for (let frame = 0; frame < spec.frames; frame++) cells.push({ name, clip, direction, frame, frames: spec.frames });
    }
  }

  const rows = Math.ceil(cells.length / SHEET_COLUMNS);
  const sheet = document.createElement('canvas');
  sheet.width = SHEET_COLUMNS * FRAME;
  sheet.height = rows * FRAME;
  const ctx = sheet.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  // A touch less colour and a touch more contrast: a muted, grounded look.
  ctx.filter = 'saturate(0.82) contrast(1.06)';

  const manifest = { frame: FRAME, scale: 0.5, anchor: ANCHOR, directions, animations: {} };
  cells.forEach((cell, index) => {
    mixer.stopAllAction();
    const action = mixer.clipAction(cell.clip);
    action.play();
    // Looping clips are sampled over the whole cycle without repeating the first pose; one-shot clips up to their end.
    const looping = cell.name === 'idle' || cell.name === 'run';
    const t = looping ? cell.frame / cell.frames : cell.frame / (cell.frames - 1);
    mixer.setTime(Math.min(cell.clip.duration - 0.001, t * cell.clip.duration));
    // Direction d faces the tile-space angle d * 45 degrees; the models look along +Z.
    model.rotation.y = Math.PI / 2 - (cell.direction * Math.PI) / 4;
    renderer.render(scene, camera);
    ctx.drawImage(renderer.domElement, (index % SHEET_COLUMNS) * FRAME, Math.floor(index / SHEET_COLUMNS) * FRAME, FRAME, FRAME);
    const list = ((manifest.animations[cell.name] ??= {})[cell.direction] ??= []);
    list.push(index);
  });
  // WebP keeps the sheets several times smaller than PNG with no visible loss.
  return { image: sheet.toDataURL('image/webp', 0.93), manifest, width: sheet.width, height: sheet.height };
};
window.ready = true;
</script>
