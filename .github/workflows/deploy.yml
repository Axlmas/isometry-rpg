# Builds main at the site root and every other branch under /preview/<branch>/,
# then deploys everything to GitHub Pages in one go.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  delete:
  workflow_run:
    workflows: [Preview trigger]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (main + branch previews)
        env:
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: bash .github/scripts/build-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
