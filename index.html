<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isometry RPG — 3D lab</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #e6dcc8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; background: rgba(18, 16, 14, 0.78); border: 1px solid #6b5432;
      border-radius: 4px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
    #help { left: 12px; top: 12px; max-width: 300px; }
    #help b { color: #e2b866; font-weight: 600; }
    #stats { right: 12px; top: 12px; font-variant-numeric: tabular-nums; color: #b9ad97; }
    #bar { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
    #bar button { font: inherit; color: #e6dcc8; background: #2a241c; border: 1px solid #6b5432;
      border-radius: 3px; padding: 6px 12px; cursor: pointer; }
    #bar button.on { background: #5a4422; border-color: #e2b866; }
    #bar button:hover { border-color: #e2b866; }
    #loading { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 15px; }
    @media (max-width: 640px) { #help { display: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="help" class="panel">
    <b>3D-лаборатория</b> — проверка моделей Tripo.<br>
    Клик по земле или WASD — идти. Пробел — удар.<br>
    1 / 2 / 3 — сменить оружие. Колесо — приблизить.
  </div>
  <div id="stats" class="panel"></div>
  <div id="bar" class="panel"></div>
  <div id="loading" class="panel">Загрузка моделей…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
