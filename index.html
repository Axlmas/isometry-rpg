<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isometry RPG</title>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <header class="panel">
      <h1 data-i18n="game.title"></h1>
      <p id="steps"></p>
      <p id="hint" data-i18n="hud.hint"></p>
    </header>
    <footer class="panel">
      <div class="actions">
        <button id="new-dungeon" type="button" data-i18n="hud.newDungeon"></button>
        <button id="language" type="button"></button>
      </div>
      <p id="save-status"></p>
    </footer>
  </div>

  <dialog id="confirm-new">
    <h2 data-i18n="confirm.newDungeon.title"></h2>
    <p data-i18n="confirm.newDungeon.body"></p>
    <form method="dialog">
      <button value="no" class="primary" data-i18n="confirm.newDungeon.no"></button>
      <button value="yes" data-i18n="confirm.newDungeon.yes"></button>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <div id="error" role="alertdialog" aria-labelledby="error-title" aria-describedby="error-body" hidden>
    <div>
      <h2 id="error-title" data-i18n="error.title"></h2>
      <p id="error-body"></p>
      <button id="error-reload" type="button" class="primary" data-i18n="error.reload"></button>
    </div>
  </div>

  <!-- The only text outside the translation catalogue: without JavaScript the catalogue cannot load. -->
  <noscript>
    <p style="padding:24px">This game needs JavaScript. Please enable it and reload the page.<br>
    Для игры нужен JavaScript. Включите его и перезагрузите страницу.</p>
  </noscript>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
